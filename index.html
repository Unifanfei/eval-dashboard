<script>
// ===== Static-site adapter (GitHub Pages deployment) =====
// Intercepts the read-only evaluation API calls and serves them from frozen JSON
// files in this repository. No server required; identical payload shapes.
(function(){
  const REAL=window.fetch;
  const API_PREFIXES=['http://127.0.0.1:8103','https://unifanfei.github.io'];
  function mapToStatic(url){
    let u=String(url).split('?')[0];
    // normalize: strip any api base
    let m=u.match(/\/api\/evaluation\/versions$/);
    if(m) return 'eval_api/versions.json';
    m=u.match(/\/api\/evaluation\/version\/([^/]+)\/summary$/);
    if(m) return 'eval_api/'+m[1]+'/summary.json';
    m=u.match(/\/api\/evaluation\/version\/([^/]+)\/models\/([^/]+)\/trials/);
    if(m) return 'eval_api/'+m[1]+'/models_'+m[2]+'_trials.json';
    m=u.match(/\/api\/evaluation\/version\/([^/]+)\/trials\/([^/?]+)/);
    if(m) return 'eval_api/'+m[1]+'/trial_'+m[2]+'.json';
    // control-plane (8092) static snapshots
    m=u.match(/\/api\/control\/prospective\/trials\/([^/?]+)/);
    if(m) return 'control/prospective_trials/'+m[1]+'.json';
    if(u.endsWith('/api/control/f1/catalog')) return 'control/f1_catalog.json';
    if(u.endsWith('/api/control/f1')) return 'control/f1.json';
    if(u.endsWith('/api/control/prospective/dashboard')) return 'control/prospective.json';
    if(u.endsWith('/api/control/datasets/prediction_ready_13912/trials')) return 'control/dataset_trials.json';
    if(u.endsWith('/api/control/datasets/prediction_ready_13912')) return 'control/datasets_prediction_ready_13912.json';
    if(u.endsWith('/api/control/workflow')) return 'control/workflow.json';
    if(u.endsWith('/api/control/versions')) return 'control/versions.json';
    if(u.endsWith('/api/control/retrospectives')) return 'control/retrospectives.json';
    return null;
  }
  window.fetch=function(url,opts){
    let mapped=mapToStatic(url);
    if(mapped!==null){return REAL(new URL(mapped,location.href).toString(),opts)}
    return REAL(url,opts);
  };
  // relative base so the same HTML works on Pages and locally
  document.addEventListener('DOMContentLoaded',function(){
    var api=document.getElementById('api');
    if(api){api.value=location.origin+'/eval_api';api.readOnly=true}
  });
})();
</script>

<script>
// 重要约束：前端只展示 API 返回结果。禁止计算轴级平均分、总分、综合排名或模型胜负。
// 禁止把 not_evaluable 转换为 0；禁止修改 reason、judge_comments、evidence_refs。
// abstained 只是终点状态，不代表整条样本不可用；所有计数由后端提供，前端不重新统计。
// 正式评估 Prompt v1 endpoint_compare 的三轴 schema；前端只透传，不合成第四轴或综合分。
const AX={prediction_accuracy:'预测准确性',analysis_quality:'分析质量',search_quality:'搜索与证据质量'};
const DIM={endpoint_field_completeness:'终点字段完整度',value_accuracy:'数值准确性',direction_consistency:'方向一致性',group_timepoint_match:'组别与时间点匹配',hallucination_endpoint:'终点幻觉',overconfidence_post_cutoff:'截止后过度自信',reasoning_trace_completeness:'推理轨迹完整度',claim_consistency:'主张一致性',uncertainty_appropriateness:'不确定性适当性',causal_plausibility:'因果合理性',hallucination_analysis:'分析幻觉',evidence_relevance:'证据相关性',claim_evidence_alignment:'主张证据对齐',evidence_sufficiency:'证据充分性',citation_correctness:'引用正确性',unused_or_misapplied_evidence:'证据误用',json_schema_pass:'JSON 契约通过',required_fields_complete:'必需字段完整',redundant_text_rate:'冗余文本比例',cutoff_boundary_obeyed:'截止边界遵守',partial_notevaluable_correct:'partial/not_evaluable 正确性'};
const $=id=>document.getElementById(id), val=x=>x===undefined||x===null?'不可评估':String(x), label=x=>DIM[x]||AX[x]||x;
// `?mock=1` 只用于本地界面演示，明确不代表正式评估数据；正式模式仍只读 FastAPI 返回结果。
const MOCK=new URLSearchParams(location.search).get('mock')==='1';let MOCK_DATA;
function mockApi(path){
  const load=MOCK_DATA?Promise.resolve(MOCK_DATA):fetch('web/mock/evaluation_glm52_nct01368588.json').then(r=>r.json()).then(x=>(MOCK_DATA=x));
  return load.then(d=>{if(path.startsWith('/api/evaluation/filters'))return d.filters;if(path.startsWith('/api/evaluation/samples?'))return {items:[d.list_item],total:1,offset:0,limit:1};if(path.startsWith('/api/evaluation/samples/'))return {samples:[d.sample],sample_ids:[d.sample.sample_id]};if(path.startsWith('/api/evaluation/compare'))return {samples:[d.sample],sample_ids:[d.sample.sample_id]};throw Error('mock接口未定义')})
}
function api(path){if(MOCK)return mockApi(path);return fetch($('api').value.replace(/\/$/,'')+path).then(async r=>{let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.detail?.message||b.detail||`接口错误 ${r.status}`);return b})}
function node(tag,textValue,cls){let x=document.createElement(tag);if(textValue!==undefined)x.textContent=textValue;if(cls)x.className=cls;return x}
function selected(id){return [...$(id).selectedOptions].map(x=>x.value)}
function fillSelect(id,values){let s=$(id);s.replaceChildren();for(let x of values)s.append(new Option(x,x))}
function query(){let p=new URLSearchParams();let q=$('q').value.trim();if(q)p.set('nct_id',q);for(let x of selected('models'))p.append('model_key',x);for(let x of selected('frameworks'))p.append('framework_name',x);for(let x of selected('versions'))p.append('run_version',x);if($('only-ne').checked)p.set('has_not_evaluable','true');if($('only-abstained').checked)p.set('has_abstained','true');p.set('limit','200');return p.toString()}
function valueClass(v){return v==='not_evaluable'?'not_evaluable':typeof v==='number'&&v===0?'zero':typeof v==='number'?'score':'not_evaluable'}
function axisCell(axis){let box=node('div',undefined,'axis-cell'),sum=axis||{valid_count:0,not_evaluable_count:0,dimensions:{}};box.append(node('div',`有效 ${sum.valid_count} · 不可评估 ${sum.not_evaluable_count}`,'axis-count'));for(let [dim,m] of Object.entries(sum.dimensions||{})){let v=m?.value, d=node('span',typeof v==='number'?String(v):v==='not_evaluable'?'—':'?',`dim-dot ${valueClass(v)}`);d.title=`${label(dim)}：${val(v)}\n${m?.reason||''}\n${(m?.evidence_refs||[]).join('\n')}`;box.append(d)}return box}
function statusSummary(c){let box=node('div',undefined,'status-list');for(let key of ['predicted','partial','abstained','missing','not_evaluable'])if((c?.[key]||0)>0)box.append(node('span',`${key} ${c[key]}`,`tag ${key}`));return box}
function showList(data){let root=$('list');root.replaceChildren();$('count').textContent=`共 ${data.total} 条新版样本`;if(!data.items.length){root.append(node('div','没有符合条件的新版评估样本','empty'));return}let t=document.createElement('table');t.className='list-table';let h=t.insertRow();['选择','NCT ID','模型标识','预测框架','运行版本','预测准确性','分析质量','搜索与证据质量','终点状态','错误原因','评审说明','操作'].forEach(x=>h.append(node('th',x)));for(let item of data.items){let r=t.insertRow(),check=document.createElement('input');check.type='checkbox';check.dataset.sampleId=item.sample_id;check.onchange=updateSelection;let selectCell=node('td');selectCell.append(check);r.append(selectCell);let n=node('td',item.nct_id,'nct');n.onclick=()=>loadDetail(item.sample_id);r.append(n);r.append(node('td',item.model_key));r.append(node('td',item.framework_name));r.append(node('td',item.run_version));for(let axis of Object.keys(AX)){let cell=node('td');cell.append(axisCell(item.axis_summary?.[axis]));r.append(cell)}let statuses=node('td');statuses.append(statusSummary(item.endpoint_status_counts));r.append(statuses);r.append(node('td',val(item.error_reason),'error'));let comments=node('span',val(item.judge_comments),'truncate');comments.title=`${val(item.judge_comments)}\n\n可读报告预览：${item.human_readable_report_preview||'不可评估'}`;let commentsCell=node('td');commentsCell.append(comments);r.append(commentsCell);let action=node('td'),b=node('button','详情','light');b.onclick=()=>loadDetail(item.sample_id);action.append(b);r.append(action)}root.append(t)}
function updateSelection(){let ids=[...document.querySelectorAll('input[data-sample-id]:checked')].map(x=>x.dataset.sampleId);$('compare').disabled=ids.length<2||ids.length>6;$('compare').textContent=ids.length?`对比选中样本（${ids.length}）`:'对比选中样本'}
function loadSamples(){msg('读取样本……');api('/api/evaluation/samples?'+query()).then(showList).then(()=>msg('已加载')).catch(e=>msg(e.message))}function msg(x){$('message').textContent=x}
function fact(parent,k,v){let d=node('div',undefined,'card fact');d.append(node('small',k),node('strong',val(v)));parent.append(d)}
function raw(parent,title,data,open=false){let d=node('details',undefined,'raw');d.open=open;let s=node('summary',title),p=node('pre',typeof data==='string'?data:JSON.stringify(data??'字段缺失',null,2));d.append(s,p);parent.append(d)}

function metric(parent,dim,m){let v=m?.value??m?.score??'not_evaluable',d=node('div',undefined,'metric'),head=node('div',undefined,'metric-head');head.append(node('span',label(dim)));let b=node('b',typeof v==='number'?String(v):val(v),valueClass(v));head.append(b);d.append(head);if(typeof v==='number'){let bar=node('div',undefined,`score-bar ${v===0?'score-zero':''}`),i=document.createElement('i');i.style.width=`${Math.max(0,Math.min(100,v))}%`;bar.append(i);d.append(bar)}let details=node('details');details.append(node('summary','展开完整解释（证据 / 优缺点 / 评分档位依据）'));renderValue(details,m?.reason??m?.basis??m?.explanation??'不可评估');let refs=node('div');refs.append(node('strong','引用来源'));for(let ref of (m?.evidence_refs||m?.evidence||[]))refs.append(node('div',String(ref),'quote'));details.append(refs);d.append(details);parent.append(d)}

 async function vcLoad(){

   for(let v of usable){

    let models=Object.keys(summary.models||{});

 function metricEnhancedCanonical(parent,dim,m){let v=m?.value??m?.score??'not_evaluable',d=node('div',undefined,'metric'),head=node('div',undefined,'metric-head');head.append(node('span',label(dim)));head.append(node('b',typeof v==='number'?String(v):val(v),valueClass(v)));d.append(head);if(typeof v==='number'){let bar=node('div',undefined,`score-bar ${v===0?'score-zero':''}`),i=document.createElement('i');i.style.width=`${Math.max(0,Math.min(100,v))}%`;bar.append(i)}let details=node('details');details.open=true;details.append(node('summary','评分依据（后端原文）'));let reason=String(m?.reason??'').trim();if(reason){let parts=[['证据',m?.evidence??'' ],['优点与不足',m?.strengths??m?.limitations??''],['评分档位依据',m?.score_band_reason??m?.scoring_basis??'']];let hasParts=parts.some(([,x])=>String(x).trim());if(hasParts){for(let [title,textValue] of parts){if(String(textValue).trim()){let block=node('div',undefined,'reason');block.append(node('strong',title+'：'));renderValue(block,textValue);details.append(block)}}}else{let block=node('div',undefined,'reason');renderValue(block,reason);details.append(block)}}let refs=node('div');refs.append(node('strong','引用来源'));for(let ref of (m?.evidence_refs||m?.evidence||[]))refs.append(node('div',String(ref),'quote'));details.append(refs);d.append(details);parent.append(d)}

 function backendReasonSections(raw){let text=String(raw??'').trim();if(!text)return[];let names=['证据','优点与不足','评分档位依据'],hits=[];for(let name of names){let at=text.indexOf(name);if(at>=0)hits.push({name,at})}hits.sort((a,b)=>a.at-b.at);if(!hits.length)return[{name:'评审原文',text:text}];let out=[];for(let i=0;i<hits.length;i++){let start=hits[i].at+hits[i].name.length;let end=i+1<hits.length?hits[i+1].at:text.length;let value=text.slice(start,end).replace(/^\s*[：:]\s*/,'').trim();if(value)out.push({name:hits[i].name,text:value})}return out}
 function metricEnhancedReadable(parent,dim,m){let v=m?.value??m?.score??'not_evaluable',d=node('div',undefined,'metric'),head=node('div',undefined,'metric-head');head.append(node('span',label(dim)));head.append(node('b',typeof v==='number'?String(v):val(v),valueClass(v)));d.append(head);if(typeof v==='number'){let bar=node('div',undefined,`score-bar ${v===0?'score-zero':''}`),i=document.createElement('i');i.style.width=`${Math.max(0,Math.min(100,v))}%`;bar.append(i)}let details=node('details');details.open=true;details.append(node('summary','评分依据（后端原文分段）'));let explicit=[['证据',m?.evidence],['优点与不足',m?.strengths??m?.limitations],['评分档位依据',m?.score_band_reason??m?.scoring_basis]].filter(([,x])=>String(x??'').trim());let sections=explicit.length?explicit.map(([name,text])=>({name,text:String(text)})):backendReasonSections(m?.reason??'');for(let part of sections){let block=node('div',undefined,'reason');block.append(node('strong',part.name+'：'));renderValue(block,part.text);details.append(block)}let refs=node('div');refs.append(node('strong','引用来源'));for(let ref of (m?.evidence_refs||m?.evidence||[]))refs.append(node('div',String(ref),'quote'));details.append(refs);d.append(details);parent.append(d)}

 // ===== 运行版本维度对比（静态部署扩展；仅在静态副本计算，主平台页面不做聚合）=====
 // 聚合口径（与后端 model_agg_metrics 相同）：每个维度取全部样本中数值型得分的算术平均，
 // not_evaluable 样本排除在分子与分母之外；n=0 的维度显示"—"且不参与综合分。
 // 综合总分 = 16 个维度各自均值再取算术平均（仅对 n>0 的维度），不引入任何权重。
 const VC_AXES={prediction_accuracy:['endpoint_field_completeness','value_accuracy','direction_consistency','group_timepoint_match','hallucination_endpoint','overconfidence_post_cutoff'],analysis_quality:['reasoning_trace_completeness','claim_consistency','uncertainty_appropriateness','causal_plausibility','hallucination_analysis'],search_quality:['evidence_relevance','claim_evidence_alignment','evidence_sufficiency','citation_correctness','unused_or_misapplied_evidence']};
 function vcDimStats(trials){let out={};for(let axis of Object.keys(VC_AXES)){for(let dim of VC_AXES[axis]){let vals=[];for(let t of trials){let v=(((t.axis_summary||{})[axis]||{}).dimensions||{})[dim]?.value;if(typeof v==='number')vals.push(v)}out[axis+'|'+dim]={mean:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,n:vals.length}}}return out}
 function vcFmt(x){return x==null?'—':(Math.round(x*10)/10).toFixed(1)}
 async function loadVersionCompare(){
  let view=$('version-compare-view');view.hidden=false;$('list').hidden=true;$('detail').hidden=true;$('compare-view').hidden=true;document.querySelector('.filters').style.display='none';document.querySelector('.toolbar-note').style.display='none';$('control-panel').classList.remove('active');
  view.replaceChildren(node('div','正在读取各运行版本评估样本……','empty'));msg('读取版本对比……');
  try{
   let versions=await fetch(liveApiBase()+'/api/evaluation/versions').then(r=>{if(!r.ok)throw Error('接口错误 '+r.status);return r.json()});
   let usable=versions.filter(x=>x.artifact_status==='valid');
   let perVersion=[];
   for(let v of usable){
    let summary=await fetch(liveApiBase()+'/api/evaluation/version/'+encodeURIComponent(v.version_id)+'/summary').then(r=>r.json());
    let models=Object.keys(summary.models||{});
    let trials=[];
    for(let model of models){
     let doc=await fetch(liveApiBase()+'/api/evaluation/version/'+encodeURIComponent(v.version_id)+'/models/'+encodeURIComponent(model)+'/trials?limit=100').then(r=>{if(!r.ok)throw Error('接口错误 '+r.status);return r.json()});
     trials=trials.concat((doc.trials||[]).map(x=>normalizeTrialSummary(x,v.version_id)));
    }
    perVersion.push({version_id:v.version_id,models,trials,stats:vcDimStats(trials)});
   }
   renderVersionCompare(view,perVersion);msg('版本对比已加载');
  }catch(e){view.replaceChildren(node('div',e instanceof Error?e.message:'版本对比加载失败','control-error'))}
 }
 function renderVersionCompareInto(root,perVersion,missing,pickedIds){
  let frag=document.createDocumentFragment();
  let single=perVersion.length===1;
  let hero=node('section',undefined,'control-hero');
  hero.append(node('h2','运行版本维度对比'+(single?'（单版本视图）':'')),
   node('p',(single?'当前只勾选了 1 个有评估工件的批次：下表为该版本自身的 16 维均值，没有 Δ 对比列；如需对比请多勾选批次。':'口径：每个维度 = 该版本全部样本中数值型得分的算术平均（not_evaluable 排除于分子与分母，n=0 显示「—」）；轴小计 = 该轴各维度均值再平均；综合总分 = 16 个维度均值再取算术平均（仅对 n>0 维度，不加权）。Δ 列 = 首列版本减去末列版本，正数表示首列更高。')+'此对比仅在静态部署页计算，用于人工浏览，不回写任何评估工件。','control-muted'));
  frag.append(hero);
  if(missing&&missing.length){
   let miss=node('section',undefined,'control-section');
   miss.append(node('h3','无三轴评估工件的所选批次（'+missing.length+' 个，仅参与上方 F1，不参与本对比）'));
   for(let m of missing)miss.append(node('p',m,'control-muted'));
   frag.append(miss);
  }
  // axis-subtotal summary table (the "which version wins where" view)
  let summ=node('section',undefined,'control-section');summ.append(node('h3',single?'轴小计（单版本）':'轴小计对比（先看这张：总分接近但各轴互有胜负）'));
  let st=document.createElement('table');st.className='control-table';let sh=st.insertRow();
  (single?['评估轴',...perVersion.map(p=>p.version_id)]:['评估轴',...perVersion.map(p=>p.version_id),'Δ（首列−末列）']).forEach(x=>sh.append(node('th',x)));
  for(let axis of Object.keys(VC_AXES)){
   let row=st.insertRow();row.append(node('td',AX[axis]));
   let first=null,last=null;
   for(let pv of perVersion){
    let dims=VC_AXES[axis].map(d=>pv.stats[axis+'|'+d]).filter(s=>s.mean!=null);
    let m=dims.length?dims.reduce((a,b)=>a+b.mean,0)/dims.length:null;
    if(first==null)first=m;last=m;
    row.append(node('td',m==null?'—':vcFmt(m)));
   }
   if(!single){
    let delta=(first!=null&&last!=null)?first-last:null;
    let dCell=node('td',delta==null?'—':(delta>0?'+':'')+vcFmt(delta));
    if(delta!=null){dCell.style.color=delta>0?'var(--green)':delta<0?'var(--red)':'var(--muted)';dCell.style.fontWeight='700'}
    row.append(dCell);
   }
  }
  // composite row
  let crow=st.insertRow();crow.append(node('td','综合总分（16维均值再平均）'));
  let firstC=null,lastC=null;
  for(let pv of perVersion){
   let means=Object.values(pv.stats).filter(s=>s.mean!=null);
   let c=means.length?means.reduce((a,b)=>a+b.mean,0)/means.length:null;
   if(firstC==null)firstC=c;lastC=c;
   crow.append(node('td',c==null?'—':vcFmt(c)));
  }
  if(!single){
   let cd=(firstC!=null&&lastC!=null)?firstC-lastC:null;
   let cdCell=node('td',cd==null?'—':(cd>0?'+':'')+vcFmt(cd));
   if(cd!=null){cdCell.style.color=cd>0?'var(--green)':cd<0?'var(--red)':'var(--muted)';cdCell.style.fontWeight='700'}
   crow.append(cdCell);
  }
  summ.append(st);
  summ.append(node('p','读法：综合总分接近不代表两个版本实力相当——正负 Δ 在轴之间方向相反时会互相抵消。请结合下方逐维度表定位各自的优势轴与短板轴。','control-muted'));
  frag.append(summ);
  // per-dimension tables grouped by axis, with delta column vs last version
  for(let axis of Object.keys(VC_AXES)){
   let sec=node('section',undefined,'control-section');sec.append(node('h3',AX[axis]+(single?'（逐维度均值）':'（逐维度均值 + Δ）')));
   let t=document.createElement('table');t.className='control-table';let hrow=t.insertRow();
   (single?['维度',...perVersion.map(p=>p.version_id)]:['维度',...perVersion.map(p=>p.version_id),'Δ（首列−末列）']).forEach(x=>hrow.append(node('th',x)));
   for(let dim of VC_AXES[axis]){
    let row=t.insertRow();row.append(node('td',DIM[dim]||dim));
    let first=null,last=null;
    for(let pv of perVersion){let stt=pv.stats[axis+'|'+dim];if(first==null)first=stt.mean;last=stt.mean;row.append(node('td',stt.mean==null?'—':vcFmt(stt.mean)+'（n='+stt.n+'）'))}
    if(!single){
     let d=(first!=null&&last!=null)?first-last:null;
     let cell=node('td',d==null?'—':(d>0?'+':'')+vcFmt(d));
     if(d!=null){cell.style.color=Math.abs(d)>=5?(d>0?'var(--green)':'var(--red)'):'var(--muted)';if(Math.abs(d)>=5)cell.style.fontWeight='700'}
     row.append(cell);
    }
   }
   sec.append(t);frag.append(sec);
  }
  // coverage note
  let note=node('section',undefined,'control-section');note.append(node('h3','覆盖度说明'));
  let nt=document.createElement('table');nt.className='control-table';let nh=nt.insertRow();
  ['运行版本','数值型维度-样本计数总数','not_evaluable 计数（各维度 n 差额）'].forEach(x=>nh.append(node('th',x)));
  for(let pv of perVersion){let total=pv.trials.length*16;let numeric=Object.values(pv.stats).reduce((a,s)=>a+s.n,0);let row=nt.insertRow();[pv.version_id,String(numeric)+' / '+total,String(total-numeric)].forEach(x=>row.append(node('td',x)))}
  note.append(nt);frag.append(note);
  return frag;
 }
